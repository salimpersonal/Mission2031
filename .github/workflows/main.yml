
name: Build Mission 2031 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Step 1: Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Install Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 4: Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Step 5: Install required SDK packages
      - name: Install Android SDK Components
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Step 6: Verify project structure
      - name: Verify Android Project
        shell: bash
        run: |
          echo "Checking Android project files..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure verified."

      # Step 7: Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # Step 8: Verify APK
      - name: Verify APK Output
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK_PATH"

      # Step 9: Upload APK
      - name: Upload Mission 2031 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mission2031-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
