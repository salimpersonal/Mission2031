
name: Build Mission 2031 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Checking preinstalled Android SDK..."

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          ls -la "$ANDROID_HOME"

      - name: Install Required Android Packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Project
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project files verified."

      - name: Build Android APK
        shell: bash
        run: |
          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Check APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mission2031-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
