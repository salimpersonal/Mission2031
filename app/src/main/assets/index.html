function templateOccurs(t,s){const d=dateAt(s);if(t.quarterly&&![0,3,6,9].includes(d.getMonth()))return false;if(t.monthlyDay)return Number(t.monthlyDay)===d.getDate();return Array.isArray(t.days)&&t.days.includes(d.getDay());}
function recurrenceFor(date){let result=[];for(const t of state.templates){let id=`${t.id}@${date}`;if(templateOccurs(t,date)&&!state.recur[id]?.movedTo){const o=state.recur[id]||{};result.push({...t,id,date,type:'recurring',done:!!o.done,skipped:!!o.skipped,description:o.note||'',sourceDate:date});}}

 return result;}
function tasksForDate(date,{mission='all',track='',includeDone=true}={}){let a=state.tasks.filter(t=>t.due===date).map(t=>({...t,type:'task',date,done:t.status==='completed'})).concat(recurrenceFor(date));return a.filter(t=>(mission==='all'||t.mission===mission)&&(!track||t.track===track)&&(includeDone||!t.done)).sort((a,b)=>Number(b.priority||1)-Number(a.priority||1)||Number(a.done)-Number(b.done)||Number(a.minutes||20)-Number(b.minutes||20));}
function isBlocked(t){return !!(t.type==='task'&&t.dependsOn&&state.tasks.some(x=>x.id===t.dependsOn&&x.status!=='completed'));}
function overdueTasks(limit=60){const today=todayKey();let result=state.tasks.filter(t=>t.due<today&&t.status!=='completed').map(t=>({...t,type:'task',date:t.due,done:false,overdue:true}));for(let n=1;n<=14;n++){let date=shiftDate(today,-n);for(const r of recurrenceFor(date)){if(!r.done&&!r.skipped&&!r.habit)result.push({...r,overdue:true});}}

function modal(title,body){document.querySelector('#modal-root').innerHTML=`<div class="modal-overlay" data-action="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-action="close-modal" aria-label="বন্ধ করুন">×</button></div>${body}</div></div>`;document.body.style.overflow='hidden';let input=document.querySelector('.modal input:not([type=hidden]),.modal textarea');if(input)input.focus({preventScroll:true});}

function validateTaskCycle(id,dependsOn){if(!id||!dependsOn)return false;let seen=new Set([id]);let next=dependsOn;for(let i=0;i<state.tasks.length+1;i++){if(seen.has(next))return true;seen.add(next);let t=state.tasks.find(t=>t.id===next);if(!t?.dependsOn)return false;next=t.dependsOn;}return true;}

function routineForm(t=null){t=t||{id:'',title:'',mission:'system',minutes:30,days:[0],priority:2,habit:false,monthlyDay:0,quarterly:false};let isMonthly=!!t.monthlyDay;let days=['রবি','সোম','মঙ্গল','বুধ','বৃহস্পতি','শুক্র','শনি'].map((x,i)=>`<label style="display:inline-flex;align-items:center;gap:4px;padding:6px;border:1px solid var(--line);border-radius:9px;margin:3px 3px 3px 0;font-size:11px"><input type="checkbox" name="day${i}" ${t.days?.includes(i)?'checked':''}>${x}</label>`).join('');modal(t.id?'রুটিন সম্পাদনা':'নতুন নিয়মিত রুটিন',`<form id="routine-form" class="form-grid" data-existing="${escapeHtml(t.id)}">${field('title','রুটিনের নাম *',t.title,'text','required maxlength="160"')}<div class="form-columns"><div class="field"><label>মিশন</label><select name="mission">${missionOptions(t.mission)}</select></div>${field('minutes','আনুমানিক মিনিট',t.minutes||30,'number','min="1" max="720" required')}</div><div class="field"><label>পুনরাবৃত্তির ধরন</label><select name="frequency" id="routine-frequency"><option value="weekly" ${!isMonthly?'selected':''}>সাপ্তাহিক / দৈনিক</option><option value="monthly" ${isMonthly&&!t.quarterly?'selected':''}>মাসিক</option><option value="quarterly" ${t.quarterly?'selected':''}>ত্রৈমাসিক</option></select></div><div class="field" id="routine-weekdays"><label>কোন কোন দিনে? (প্রতিদিন চাইলে সব নির্বাচন করুন)</label><div>${days}</div></div><div class="field" id="routine-monthday"><label>মাসের কত তারিখে?</label><input type="number" name="monthlyDay" min="1" max="28" value="${t.monthlyDay||1}"></div><div class="field"><label><input type="checkbox" name="habit" ${t.habit?'checked':''}> এটি একটি দৈনিক অভ্যাস; মিস হলে backlog-এ যোগ হবে না</label></div><div class="modal-foot">${t.id?`<button class="button danger" data-action="delete-routine" data-id="${escapeHtml(t.id)}" type="button">মুছুন</button>`:''}<button type="button" class="button ghost" data-action="close-modal">বাতিল</button><button type="submit" class="button">সেভ করুন</button></div></form>`);updateRoutineType();}
function updateRoutineType(){let f=document.querySelector('#routine-frequency');if(!f)return;const weekly=f.value==='weekly';document.querySelector('#routine-weekdays').style.display=weekly?'block':'none';document.querySelector('#routine-monthday').style.display=weekly?'none':'block';}
function rescheduleForm(id){const rec=id.includes('@');let orig=rec?id.split('@')[1]:state.tasks.find(t=>t.id===id)?.due;const t=rec?state.templates.find(x=>x.id===id.split('@')[0]):state.tasks.find(x=>x.id===id);if(!t)return;let scheduled=rec?state.recur[id]?.movedTo||orig:orig;modal('কাজের নতুন তারিখ',`<p class="help">${escapeHtml(t.title)}</p><form id="reschedule-form" data-id="${escapeHtml(id)}" class="form-grid">${field('due','নতুন তারিখ',scheduled,'date','required')}<div class="modal-foot"><button type="button" class="button ghost" data-action="close-modal">বাতিল</button>${rec?'<button type="button" class="button ghost" data-action="skip-occurrence" data-id="'+escapeHtml(id)+'">আজ বাদ দিন</button>':''}<button class="button" type="submit">নতুন তারিখ দিন</button></div></form>`);}
function settingsModal(){modal('অফলাইন সেটিংস ও ব্যাকআপ',`<div class="callout">🔒 আপনার ডেটা ফোনের অ্যাপ স্টোরেজে থাকে। কোনো সার্ভার, লগইন বা ইন্টারনেট ব্যবহার হয় না। ফোন রিসেট বা অ্যাপ আনইনস্টল করলে ব্যাকআপ ছাড়া তথ্য হারাতে পারে।</div><div class="panel margin-top"><h3>ব্যাকআপ ও পুনরুদ্ধার</h3><p>নিয়মিত JSON ব্যাকআপ সংরক্ষণ করুন। পুনরুদ্ধার করলে বর্তমান ডেটা সম্পূর্ণ বদলে যাবে।</p><div class="row-actions margin-top">${buttonAction('↓ ব্যাকআপ সেভ','export-backup','','')}${buttonAction('↑ ব্যাকআপ ফিরিয়ে আনুন','import-backup','','ghost')}</div></div><div class="panel"><h3>আপনার মিশন ও রুটিন</h3><p>প্রথম চারটি নথির ভিত্তিতে চারটি মিশন, ৫টি মিডিয়া চ্যানেল, ৯ ওয়ার্ড এবং ৫ বছরের মাইলস্টোন যুক্ত আছে। রুটিন ও ব্যক্তিগত কাজ সম্পাদনাযোগ্য।</p><div class="row-actions margin-top">${buttonAction('রুটিন সম্পাদনা','edit-routines','','ghost')}${buttonAction('নতুন কাজ','add-task','','ghost')}</div></div><div class="panel"><h3>সতর্কতা</h3><p>ব্যবসার লক্ষ্য ও আয় অর্জনের নিশ্চয়তা নয়। জনসেবার নথিতে অপ্রয়োজনীয় পরিচয়, রাজনৈতিক আনুগত্য, চিকিৎসা বা সংবেদনশীল তথ্য লিখবেন না। রপ্তানি করা ব্যাকআপ ফাইল এনক্রিপ্টেড নয়।</p></div><div class="panel"><h3>সমস্ত ডেটা নতুন করে শুরু</h3><p>কেবল প্রয়োজন হলে, আগে ব্যাকআপ নিয়ে তারপর রিসেট করুন।</p><div class="margin-top">${buttonAction('সব স্থানীয় তথ্য রিসেট','reset-all','','danger')}</div></div><p class="fineprint">Mission 2031 · v1.0 · Android offline personal planner · কোনো তৃতীয় পক্ষের analytics নেই</p>`);}
function exportBackup(){let raw=JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Mission2031'},null,2);if(typeof AndroidBridge!=='undefined'&&typeof AndroidBridge.saveBackup==='function'){try{AndroidBridge.saveBackup(raw);toast('ফাইল সেভ করার স্থান নির্বাচন করুন');return;}catch(e){console.warn(e);}}let blob=new Blob([raw],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Mission2031-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);toast('ব্যাকআপ ডাউনলোড শুরু হয়েছে');}
async function importBackup(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('ব্যাকআপ ফাইল ১২ MB এর বেশি');let text=typeof file.text==='function'?await file.text():await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('ফাইল পড়া যায়নি'));reader.readAsText(file);}),parsed=JSON.parse(text);let checked=sanitizeState(parsed);if(!confirm('আপনার বর্তমান সব কাজ, নোট ও হিসাব এই ব্যাকআপ দিয়ে বদলে যাবে। নিশ্চিত?'))return;state=checked;save();closeModal();navigate('home');toast('ব্যাকআপ সফলভাবে ফিরিয়ে আনা হয়েছে');}catch(e){toast('ব্যাকআপ পড়া যায়নি: '+e.message,true);}finally{document.querySelector('#backup-input').value='';}}
function rebalanceWeek(){const start=weekStart(todayKey()),load=weeklyLoad(start),days=load.days.filter(d=>d>=todayKey()),moved=[];let iterations=0;for(const date of days){let candidates=tasksForDate(date).filter(t=>t.type==='recurring'&&!t.habit&&!t.done&&!t.skipped).sort((a,b)=>(a.priority||2)-(b.priority||2));for(const t of candidates){if(load.dayMinutes[date]<=220||iterations>12)break;const other=days.filter(d=>d!==date&&load.dayMinutes[d]+t.minutes<=220).sort((a,b)=>load.dayMinutes[a]-load.dayMinutes[b]||a.localeCompare(b))[0];if(!other)continue;state.recur[t.id]={...(state.recur[t.id]||{}),movedTo:other,done:false,skipped:false};load.dayMinutes[date]-=t.minutes;load.dayMinutes[other]+=t.minutes;moved.push([date,other,t.id]);iterations++;}}if(moved.length)saveAndRender(`${bn(moved.length)}টি রুটিন তুলনামূলক ফাঁকা দিনে নেওয়া হয়েছে`);else toast('এই সপ্তাহে নিরাপদে স্থানান্তরযোগ্য রুটিন পাওয়া যায়নি');}
function autoReschedule(){const overdue=overdueTasks(120).filter(t=>!isBlocked(t)).slice(0,14);if(!overdue.length){toast('স্থানান্তরযোগ্য মিস হওয়া কাজ নেই');return;}let cur=todayKey();let candidates=Array.from({length:7},(_,i)=>shiftDate(cur,i+1));let loads=Object.fromEntries(candidates.map(s=>[s,tasksForDate(s).filter(t=>!t.done).reduce((x,t)=>x+Number(t.minutes||0),0)]));let changes=0;for(const t of overdue){const target=candidates.slice().sort((a,b)=>loads[a]-loads[b]||a.localeCompare(b))[0];if(t.type==='recurring'){state.recur[t.id]={...(state.recur[t.id]||{}),movedTo:target,done:false,skipped:false};}else{const orig=state.tasks.find(x=>x.id===t.id);if(orig)orig.due=target;}loads[target]+=Number(t.minutes)||30;changes++;}saveAndRender(`${bn(changes)}টি কাজ আগামী ৭ দিনে ভাগ করা হয়েছে`);}
function handleAction(action,id){if(action==='close-modal'){closeModal();return;}if(action==='modal-backdrop')return;
if(action==='nav-home')return navigate('home');if(action==='nav-today')return navigate('today');if(action==='nav-plan')return navigate('plan');
if(action==='prev-day'||action==='next-day'){ui.selectedDate=shiftDate(ui.selectedDate,action==='prev-day'?-1:1);return render();}
if(action==='set-mission'){ui.mission=id;ui.track='';return render();}if(action==='set-track'){ui.track=id;return render();}if(action==='task-filter'){ui.taskFilter=id;return render();}if(action==='select-year'){ui.selectedYear=Math.max(0,Math.min(4,Number(id)));return render();}
if(action==='note-kind'){ui.noteView=id;return render();}if(action==='idea-filter'){ui.ideaFilter=id;return render();}
if(action==='toggle-milestone'){state.milestones[id]=!state.milestones[id];return saveAndRender('মাইলস্টোনের অবস্থা সেভ হয়েছে');}
if(action==='toggle-task'){let recurring=id.includes('@'),t;if(recurring){const stamp=state.recur[id]||{};stamp.done=!stamp.done;stamp.skipped=false;state.recur[id]=stamp;}else{t=state.tasks.find(t=>t.id===id);if(!t)return;if(t.status!=='completed'&&isBlocked({...t,type:'task'})){toast('প্রথমে আগের নির্ভরশীল কাজটি শেষ করুন',true);return;}t.status=t.status==='completed'?'open':'completed';t.completedAt=t.status==='completed'?new Date().toISOString():null;}return saveAndRender('কাজের অবস্থা সেভ হয়েছে');}
if(action==='add-task')return taskForm();if(action==='milestone-new-task'){const m=MILESTONES.find(x=>x.id===id);return m&&taskForm(null,{title:'',body:'',mission:m.mission,milestoneId:id});}if(action==='edit-task'){if(id.includes('@'))return routineForm(state.templates.find(t=>t.id===id.split('@')[0]));return taskForm(state.tasks.find(t=>t.id===id));}
if(action==='delete-task'){if(!confirm('এই কাজটি মুছে ফেলবেন?'))return;state.tasks=state.tasks.filter(t=>t.id!==id);state.tasks.forEach(t=>{if(t.dependsOn===id)t.dependsOn='';});closeModal();return saveAndRender('কাজটি মুছে ফেলা হয়েছে');}
if(action==='reschedule-task')return rescheduleForm(id);
if(action==='skip-occurrence'){state.recur[id]={...(state.recur[id]||{}),skipped:true,done:false};closeModal();return saveAndRender('এই দিনের রুটিন বাদ দেওয়া হয়েছে');}
if(action==='auto-reschedule')return autoReschedule();if(action==='rebalance-week')return rebalanceWeek();if(action==='show-overdue'){ui.taskFilter='overdue';return navigateOverdue();}
if(action==='add-idea')return ideaForm();if(action==='edit-idea')return ideaForm(state.ideas.find(n=>n.id===id));
if(action==='idea-to-task'){const n=state.ideas.find(n=>n.id===id);if(n)return taskForm(null,n);return;}
if(action==='delete-idea'){if(!confirm('নোটটি মুছে ফেলবেন?'))return;state.ideas=state.ideas.filter(n=>n.id!==id);closeModal();return saveAndRender('নোটটি মুছে ফেলা হয়েছে');}
if(action==='add-review')return reviewForm();if(action==='delete-review'){if(!confirm('এই রিভিউ মুছে ফেলবেন?'))return;state.reviews=state.reviews.filter(r=>r.id!==id);return saveAndRender('রিভিউ মুছে ফেলা হয়েছে');}
if(action==='edit-finance')return financeForm();
if(action==='edit-routines')return modal('সাপ্তাহিক ও মাসিক রুটিন',templatesList());
if(action==='edit-routine')return routineForm(state.templates.find(t=>t.id===id));if(action==='new-routine')return routineForm();
if(action==='delete-routine'){if(!confirm('এই নিয়মিত রুটিনটি মুছে ফেলবেন?'))return;state.templates=state.templates.filter(t=>t.id!==id);for(let k of Object.keys(state.recur))if(k.startsWith(id+'@'))delete state.recur[k];closeModal();return saveAndRender('রুটিন মুছে ফেলা হয়েছে');}
if(action==='export-backup')return exportBackup();if(action==='import-backup')return document.querySelector('#backup-input').click();
if(action==='reset-all'){if(!confirm('সতর্কতা: সব কাজ, নোট, হিসাব ও অগ্রগতি স্থায়ীভাবে মুছে যাবে। রিসেট করবেন?'))return;state=makeInitialState();save();closeModal();return navigate('home');}
}
function navigateOverdue(){ui.tab='today';ui.taskFilter='overdue';ui.mission='all';ui.track='';render();window.scrollTo(0,0);}
function onSubmit(e){let form=e.target;if(!form.id||!['task-form','idea-form','routine-form','review-form','finance-form','reschedule-form'].includes(form.id))return;e.preventDefault();let f=new FormData(form),get=k=>String(f.get(k)||'').trim(),id=form.dataset.existing||'';
if(form.id==='task-form'){let title=get('title'),due=get('due'),minutes=Math.max(5,Math.min(720,Number(get('minutes'))||40)),dependsOn=get('dependsOn');if(!title||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(due)){toast('সঠিক শিরোনাম ও তারিখ দিন',true);return;}if(validateTaskCycle(id,dependsOn)){toast('কাজের নির্ভরতায় চক্র তৈরি হবে',true);return;}let existing=state.tasks.find(t=>t.id===id),task={id:id||uid('task'),title,mission:normMission(get('mission')),milestoneId:get('milestoneId'),track:get('track'),due,minutes,priority:Number(get('priority'))||2,dependsOn,notes:get('notes'),status:existing?.status||'open',createdAt:existing?.createdAt||todayKey(),completedAt:existing?.completedAt};if(existing)Object.assign(existing,task);else state.tasks.push(task);let ideaId=form.dataset.idea||'';if(ideaId){const n=state.ideas.find(n=>n.id===ideaId);if(n){n.status='active';n.linkedTask=task.id;n.updatedAt=new Date().toISOString();}}closeModal();return saveAndRender('কাজ সংরক্ষিত হয়েছে');}
if(form.id==='idea-form'){const title=get('title');if(!title){toast('নোটের শিরোনাম দিন',true);return;}let prev=state.ideas.find(n=>n.id===id);let n={id:id||uid('idea'),title,type:get('type')==='note'?'note':'idea',mission:normMission(get('mission')),body:get('body'),status:STATUS_LABELS[get('status')]?get('status'):'inbox',createdAt:prev?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),linkedTask:prev?.linkedTask};if(prev)Object.assign(prev,n);else state.ideas.push(n);closeModal();return saveAndRender('নোট সংরক্ষিত হয়েছে');}
if(form.id==='review-form'){if(!get('achieved')||!get('next')){toast('অর্জন ও পরবর্তী পদক্ষেপ লিখুন',true);return;}state.reviews.push({id:uid('review'),type:get('type'),date:get('date'),mission:normMission(get('mission')),achieved:get('achieved'),blocked:get('blocked'),next:get('next')});closeModal();return saveAndRender('রিভিউ সংরক্ষিত হয়েছে');}
if(form.id==='finance-form'){for(let i=0;i<5;i++){const play=Number(get('play'+i)),media=Number(get('media'+i));if(!Number.isFinite(play)||!Number.isFinite(media)||media<0){toast('সঠিক আর্থিক পরিমাণ দিন',true);return;}state.financials.play[i]=play;state.financials.media[i]=media;}closeModal();return saveAndRender('আর্থিক হিসাব সংরক্ষিত হয়েছে');}
if(form.id==='reschedule-form'){let entry=form.dataset.id, date=get('due');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('সঠিক তারিখ দিন',true);return;}if(entry.includes('@')){state.recur[entry]={...(state.recur[entry]||{}),movedTo:date,skipped:false};}else{const t=state.tasks.find(x=>x.id===entry);if(t)t.due=date;}closeModal();return saveAndRender('নতুন তারিখ সংরক্ষিত হয়েছে');}
if(form.id==='routine-form'){let title=get('title'),freq=get('frequency'),days=[0,1,2,3,4,5,6].filter(i=>f.get('day'+i));if(!title){toast('রুটিনের নাম দিন',true);return;}if(freq==='weekly'&&!days.length){toast('কমপক্ষে একটি দিন বাছাই করুন',true);return;}const prev=state.templates.find(t=>t.id===id);let monthDay=Math.max(1,Math.min(28,Number(get('monthlyDay'))||1));let t={id:id||uid('routine'),title,mission:normMission(get('mission')),minutes:Math.max(1,Math.min(720,Number(get('minutes'))||30)),days:freq==='weekly'?days:[],monthlyDay:freq==='weekly'?0:monthDay,quarterly:freq==='quarterly',priority:prev?.priority||2,habit:!!f.get('habit')};if(prev)Object.assign(prev,t);else state.templates.push(t);closeModal();return saveAndRender('নিয়মিত রুটিন সংরক্ষিত হয়েছে');}
}
function attach(){document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='modal-backdrop'&&e.target!==b)return;handleAction(b.dataset.action,b.dataset.id||'');});document.addEventListener('change',e=>{if(e.target.id==='selected-day'){ui.selectedDate=e.target.value||todayKey();render();}if(e.target.id==='routine-frequency')updateRoutineType();if(e.target.id==='task-mission-selector'){let m=normMission(e.target.value);let track=document.querySelector('#task-track-selector'),mile=document.querySelector('#task-milestone-selector');if(track)track.innerHTML=trackOptions(m);if(mile)mile.innerHTML=milestoneOptions(m);}if(e.target.id==='backup-input')importBackup(e.target.files?.[0]);});document.addEventListener('submit',onSubmit);document.querySelector('#open-settings').addEventListener('click',settingsModal);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal'))closeModal();});}
state=load();attach();render();

</script>
</body>
</html>
